<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>マンカラ・ベーシック</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#17130f;color:#f5e9d2}
.wrap{min-height:100vh;display:flex;justify-content:center;padding:24px}
.panel{width:min(1080px,100%)}
header{display:flex;justify-content:space-between;align-items:center;gap:16px}
button{font:inherit}
.control{padding:10px 18px;border:0;border-radius:10px;background:#d99a32;color:#20150a;font-weight:700;cursor:pointer}
.message{padding:12px 18px;background:#2b2118;border-radius:12px}
.board{display:grid;grid-template-columns:130px minmax(0,1fr) 130px;grid-template-rows:1fr 1fr;gap:16px;padding:24px;border-radius:28px;background:#70461f;border:8px solid #9b6630;box-shadow:inset 0 0 40px #241308;align-items:center}
.row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;min-width:0}
.row.ai{grid-column:2;grid-row:1}
.row.human{grid-column:2;grid-row:2}
.store:first-child{grid-column:1;grid-row:1 / 3}
.store:last-child{grid-column:3;grid-row:1 / 3}
.store{min-height:190px;border-radius:55px;background:#3a2617;display:flex;flex-direction:column;justify-content:center;align-items:center;border:3px solid #2a1b10;box-shadow:inset 0 8px 18px #0008,0 3px 0 #b47739}
.store b{font-size:42px}
.pit{width:100%;aspect-ratio:1.25;min-height:88px;padding:8px;border-radius:50%;border:4px solid #2a1b10;background:radial-gradient(ellipse at 35% 30%,#76502e 0%,#49301d 42%,#21150e 100%);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 10px 18px #000a,0 3px 0 #b47739}
.pit:disabled{cursor:default;opacity:.72}
.pit:not(:disabled):hover{outline:3px solid #f2bf5c;transform:translateY(-2px)}
.pit small{font-size:12px;opacity:.65}
.pit strong{font-size:32px;line-height:1.1}
.help{opacity:.75;margin-top:18px}
select{padding:8px;background:#211811;color:#fff;border:1px solid #6d5036;border-radius:8px}
.settings{display:flex;align-items:center;gap:10px}
@media(max-width:760px){
 .board{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;padding:14px}
 .store:first-child{grid-column:1;grid-row:1}
 .row.ai{grid-column:1;grid-row:2}
 .row.human{grid-column:1;grid-row:3}
 .store:last-child{grid-column:1;grid-row:4}
 .row{gap:7px}
 .store{min-height:78px;border-radius:18px}
 .pit{min-height:62px;aspect-ratio:1.05;border-width:3px}
 .pit strong{font-size:24px}
 header h1{font-size:24px}
}
</style>
</head>
<body>
<div class="wrap"><div class="panel">
<header><h1>マンカラ・ベーシック</h1><button class="control" id="reset">リセット</button></header>
<p class="message" id="message"></p>
<div class="board">
<div class="store"><span>AIゴール</span><b id="s2">0</b></div>
<div class="row ai" id="ai"></div>
<div class="row human" id="human"></div>
<div class="store"><span>あなたのゴール</span><b id="s1">0</b></div>
</div>
<div class="settings"><label>AI難易度 <select id="difficulty"><option value="easy">簡単</option><option value="normal" selected>普通</option><option value="hard">難しい</option></select></label></div>
<p class="help">12個のポケットに4個ずつ。キャプチャなし。最後の石がゴールならもう一度です。</p>
</div></div>
<script>
const P1=[0,1,2,3,4,5],P2=[7,8,9,10,11,12];
let board,turn=1,busy=false;
const $=id=>document.getElementById(id);
function reset(){board=Array(14).fill(4);board[6]=board[13]=0;turn=1;busy=false;render();msg('あなたの番です。');}
function empty(p){return(p?P2:P1).every(i=>board[i]===0)}
function over(){return empty(0)||empty(1)}
function move(i,p){
 if(busy||turn!==p||board[i]===0)return;
 let n=board.slice(),stones=n[i];n[i]=0;let x=i;
 while(stones--){x=(x+1)%14;n[x]++}
 board=n;
 if(over()){busy=true;render();msg(empty(0)?'あなたの勝ちです。':'AIの勝ちです。');return}
 if((p===1&&x===6)||(p===2&&x===13)){render();msg(p===1?'ゴールで終わったので、もう一度です。':'AIはゴールで終わったので、もう一度です。');if(p===2)ai();return}
 turn=p===1?2:1;render();msg(turn===1?'あなたの番です。':'AIの番です。');if(turn===2)ai();
}
function choose(){
 const m=P2.filter(i=>board[i]>0),d=$('difficulty').value;
 if(!m.length)return -1;
 if(d==='easy')return m[Math.floor(Math.random()*m.length)];
 let best=m[0],score=-1e9;
 for(const i of m){
  const stones=board[i];let x=i;
  for(let k=0;k<stones;k++)x=(x+1)%14;
  let s=(x===13?100:0)+stones;
  if(d==='hard')s+=board[P2[(P2.indexOf(i)+1)%6]];
  if(s>score){score=s;best=i}
 }
 return best;
}
function ai(){if(over()||turn!==2)return;busy=true;setTimeout(()=>{busy=false;const i=choose();if(i>=0)move(i,2)},350)}
function msg(t){$('message').textContent=t}
function render(){
 $('s1').textContent=board[6];$('s2').textContent=board[13];
 $('human').innerHTML='';$('ai').innerHTML='';
 P1.forEach(i=>pit($('human'),i,1));P2.forEach(i=>pit($('ai'),i,2));
}
function pit(el,i,p){
 const b=document.createElement('button');b.className='pit';
 b.disabled=p!==1||turn!==1||busy||board[i]===0;
 b.innerHTML='<small>穴 '+(i+1)+'</small><strong>'+board[i]+'</strong>';
 b.onclick=()=>move(i,p);el.appendChild(b);
}
$('reset').onclick=reset;reset();
</script>
</body></html>
